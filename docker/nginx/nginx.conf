events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Without this, nginx resolves the service names
    # once at startup and caches the container IPs forever — every deploy
    # recreates backend/frontend with new IPs, leaving nginx proxying to dead
    # ones (502 until restarted). `valid=10s` re-resolves at most every 10s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP — redirect to HTTPS, except ACME challenge for cert renewal
    server {
        listen 80;
        server_name trustlink.website www.trustlink.website;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — main server
    server {
        listen 443 ssl;
        http2 on;
        server_name trustlink.website www.trustlink.website;

        ssl_certificate     /etc/letsencrypt/live/trustlink.website/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trustlink.website/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;

        # The resolver only applies to proxy_pass targets that contain a
        # variable — a literal hostname would still be cached at startup.
        set $backend_upstream http://backend:4000;
        set $frontend_upstream http://frontend:3000;

        # SSE endpoint — disable buffering so events stream immediately
        location /api/notifications/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering "no";
        }

        # API requests → NestJS backend (strip /api/ prefix)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
