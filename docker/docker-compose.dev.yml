# Dev overrides — auto-loaded by `docker compose up` (no -f flag needed)
# Hot-reload via volume mounts + dev build targets.
services:
  backend:
    build:
      target: dev
    volumes:
      - ../backend/src:/app/src
      - ../backend/test:/app/test
      - ../backend/tsconfig.json:/app/tsconfig.json
      - ../backend/tsconfig.build.json:/app/tsconfig.build.json
      - ../backend/nest-cli.json:/app/nest-cli.json
      - ../backend/eslint.config.mjs:/app/eslint.config.mjs
      - /app/node_modules
    command: npm run start:dev

  frontend:
    build:
      target: dev
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/next.config.ts:/app/next.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ../frontend/eslint.config.mjs:/app/eslint.config.mjs
      - ../frontend/next-env.d.ts:/app/next-env.d.ts
      - /app/node_modules
      - /app/.next
    command: npm run dev
