services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustlink-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-trustlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trustlink_secret}
      POSTGRES_DB: ${DB_DATABASE:-trustlink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trustlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trustlink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trustlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trustlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: trustlink-backend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trustlink-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, and compose interpolation
        # reads only the shell / docker/.env — NOT ../.env (that file is
        # runtime-only via env_file). Default to the local backend so a plain
        # `docker compose up --build` works; production images are built by CI
        # with an explicit NEXT_PUBLIC_API_URL=/api build-arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS}
        NEXT_PUBLIC_POLYGON_CHAIN_ID: ${NEXT_PUBLIC_POLYGON_CHAIN_ID:-80002}
    container_name: trustlink-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trustlink-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: trustlink-ai-service
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    networks:
      - trustlink-network

  nginx:
    image: nginx:alpine
    container_name: trustlink-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - trustlink-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trustlink-pgadmin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trustlink.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - trustlink-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  certbot_www:

networks:
  trustlink-network:
    driver: bridge
