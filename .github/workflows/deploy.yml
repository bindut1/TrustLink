name: Deploy

on:
  push:
    branches: [master]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json
      - run: npm ci
        working-directory: smart-contracts
      - run: npm test
        working-directory: smart-contracts

  test-ai-service:
    name: Test AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest
        working-directory: ai-service
      # Only the model-free tests run in CI; tests/test_similarity.py needs the
      # ~500MB sentence-transformers model and is meant for local runs.
      - run: python -m pytest tests/test_matching.py -q
        working-directory: ai-service

  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-contracts, test-ai-service]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_CONTRACT_ADDRESS=${{ vars.NEXT_PUBLIC_CONTRACT_ADDRESS }}
            NEXT_PUBLIC_POLYGON_CHAIN_ID=${{ vars.NEXT_PUBLIC_POLYGON_CHAIN_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-ai-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-ai-service:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TrustLink
            git pull origin master
            cd docker
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            IMAGE_TAG="${{ github.sha }}" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            IMAGE_TAG="${{ github.sha }}" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
