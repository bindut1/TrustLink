name: Deploy

on:
  push:
    branches: [master]

jobs:
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_CONTRACT_ADDRESS=${{ vars.NEXT_PUBLIC_CONTRACT_ADDRESS }}
            NEXT_PUBLIC_POLYGON_CHAIN_ID=${{ vars.NEXT_PUBLIC_POLYGON_CHAIN_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push ai-service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-ai-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trustlink-ai-service:latest
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TrustLink
            git pull origin master
            cd docker
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            IMAGE_TAG="${{ github.sha }}" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            IMAGE_TAG="${{ github.sha }}" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
